<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuis: Topologi Jaringan Komputer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='6' cy='12' r='3.4' fill='%2322d3ee'/%3E%3Ccircle cx='18' cy='6' r='3.4' fill='%2322d3ee'/%3E%3Ccircle cx='18' cy='18' r='3.4' fill='%2322d3ee'/%3E%3Cline x1='8.8' y1='10.6' x2='15.2' y2='7.4' stroke='%2322d3ee' stroke-width='1.8'/%3E%3Cline x1='8.8' y1='13.4' x2='15.2' y2='16.6' stroke='%2322d3ee' stroke-width='1.8'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0b1220; --panel:#131c2e; --panel-2:#0f1726; --border:#24324a;
    --text:#e6edf7; --text-dim:#8b9bb4;
    --cyan:#22d3ee; --amber:#fbbf24; --green:#4ade80; --red:#f87171;
    --r-lg:20px; --r-md:12px; --r-sm:8px;
    --font-head: ui-monospace, "Cascadia Code", "Fira Code", Menlo, Consolas, monospace;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh; background:var(--bg);
    background-image:
      radial-gradient(circle at 15% -10%, rgba(34,211,238,.10), transparent 40%),
      radial-gradient(circle at 90% 110%, rgba(251,191,36,.07), transparent 40%);
    color:var(--text); font-family:var(--font-body);
    display:flex; align-items:center; justify-content:center; padding:28px 16px;
  }
  .page{width:100%; max-width:480px;}
  .quiz{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--r-lg);
    padding:22px; box-shadow:0 24px 60px rgba(0,0,0,.4);
  }
  .quiz-head{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .brand{display:flex; align-items:center; gap:8px; font-family:var(--font-head); font-weight:600; font-size:14.5px; color:var(--cyan);}
  .progress{display:flex; flex-direction:column; align-items:flex-end; gap:5px; min-width:92px;}
  .progress-track{width:92px; height:4px; border-radius:2px; background:var(--border); overflow:hidden;}
  .progress-fill{height:100%; background:var(--cyan); transition:width .35s ease;}
  .progress-label{font-size:11px; color:var(--text-dim); font-family:var(--font-head);}
  .hint{text-align:center; color:var(--text-dim); font-size:13.5px; line-height:1.55; margin:14px 6px 0;}

  .diagram-panel{
    background:var(--panel-2); border:1px solid var(--border); border-radius:var(--r-md);
    padding:14px; margin-top:14px; animation:reveal .4s ease;
  }
  .diagram-panel svg{width:100%; height:auto; display:block;}
  
  .scenario-box {
    background:var(--panel-2); border:1px solid var(--border); border-radius:var(--r-md);
    padding:18px; margin-top:14px; animation:reveal .4s ease;
    font-size: 14.5px; line-height: 1.6; color: var(--text);
  }
  .scenario-box strong { color: var(--amber); }

  @keyframes reveal{from{opacity:0; transform:scale(.97);} to{opacity:1; transform:scale(1);}}

  .legend{display:flex; gap:16px; justify-content:center; margin-top:10px; font-size:12px; color:var(--text-dim);}
  .legend-item{display:flex; align-items:center; gap:6px;}
  .dot{width:10px; height:10px; display:inline-block; border-radius: 2px;}
  .dot-cyan{background:var(--cyan);} .dot-amber{background:var(--amber); border-radius: 50%;}

  .options{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;}
  
  .option{
    font-family:var(--font-body); font-size:14.5px; color:var(--text);
    background:var(--panel-2); border:1px solid var(--border); border-radius:var(--r-sm);
    padding:12px 10px; cursor:pointer; transition:border-color .15s ease, transform .1s ease;
  }
  .option:hover:not(:disabled){border-color:var(--cyan);}
  .option:active:not(:disabled){transform:scale(.98);}
  .option:focus-visible{outline:2px solid var(--cyan); outline-offset:2px;}
  .option:disabled{cursor:default;}
  .option.correct{border-color:var(--green); background:rgba(74,222,128,.12);}
  .option.incorrect{border-color:var(--red); background:rgba(248,113,113,.12);}

  /* Modifikasi khusus untuk opsi dengan gambar diagram */
  .option-img {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 6px;
  }
  .mini-diagram {
    width: 100%; height: 75px; 
    display: flex; align-items: center; justify-content: center;
    pointer-events: none; /* Mencegah bug klik pada SVG */
  }
  .mini-diagram svg {
    max-width: 100%; max-height: 100%;
  }
  .option-img span {
    font-size: 13.5px; font-weight: 600; pointer-events: none;
  }

  .feedback{
    margin-top:16px; padding:14px 16px; border-radius:var(--r-sm); border-left:3px solid var(--border);
    background:var(--panel-2); animation:reveal .3s ease;
  }
  .feedback.is-correct{border-left-color:var(--green);}
  .feedback.is-incorrect{border-left-color:var(--red);}
  .feedback-title{margin:0 0 6px; font-weight:600; font-size:14.5px;}
  .feedback-text{margin:0; font-size:13.5px; color:var(--text-dim); line-height:1.55;}

  .next-btn{
    margin-top:14px; width:100%; font-family:var(--font-head); font-size:13.5px; font-weight:600;
    letter-spacing:.02em; color:#06222a; background:var(--cyan); border:none; border-radius:var(--r-sm);
    padding:12px; cursor:pointer; transition:filter .15s ease;
  }
  .next-btn:hover{filter:brightness(1.08);}
  .next-btn:focus-visible{outline:2px solid var(--text); outline-offset:2px;}

  .result{text-align:center; padding-top:4px;}
  .result-score{font-family:var(--font-head); font-size:42px; font-weight:700; margin:6px 0 4px; color:var(--cyan);}
  .result-msg{color:var(--text-dim); font-size:14px; margin:0 0 18px; line-height:1.5;}
  .result-list{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:20px;}
  .result-chip{font-size:12.5px; padding:6px 10px; border-radius:999px; border:1px solid var(--border);}
  .result-chip.ok{color:var(--green); border-color:rgba(74,222,128,.4);}
  .result-chip.bad{color:var(--red); border-color:rgba(248,113,113,.4);}

  @media (max-width:380px){ .options{grid-template-columns:1fr;} }
  @media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important;} }
</style>
</head>
<body>
  <div class="page">
    <div class="quiz">
      <div class="quiz-head">
        <div class="brand">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="6" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="18" cy="6" r="3.2" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="18" cy="18" r="3.2" stroke="currentColor" stroke-width="1.8"/>
            <line x1="8.8" y1="10.6" x2="15.2" y2="7.4" stroke="currentColor" stroke-width="1.8"/>
            <line x1="8.8" y1="13.4" x2="15.2" y2="16.6" stroke="currentColor" stroke-width="1.8"/>
          </svg>
          <span>Kuis Jaringan</span>
        </div>
        <div class="progress" id="progressBox">
          <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
          <span class="progress-label" id="progressLabel">Soal 1 / 10</span>
        </div>
      </div>
      <p class="hint" id="quizHint">Amati bentuk diagramnya, lalu tebak nama topologi jaringannya.</p>
      <div id="quizBody"></div>
    </div>
  </div>

<script>
// Palet Warna
const CYAN = '#22d3ee';
const AMBER = '#fbbf24';
const EDGE = '#3b4a63';

// Helper geometri untuk menata posisi node secara presisi
function circleNodes(n, cx, cy, r, startDeg = -90) {
  return Array.from({ length: n }, (_, i) => {
    const a = (startDeg + (i * 360) / n) * (Math.PI / 180);
    return { x: +(cx + r * Math.cos(a)).toFixed(1), y: +(cy + r * Math.sin(a)).toFixed(1) };
  });
}
function ringPairs(n) { return Array.from({ length: n }, (_, i) => [i, (i + 1) % n]); }
function allPairs(n) {
  const p = [];
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) p.push([i, j]);
  return p;
}

// Membedakan bentuk SVG antara Hub/Switch (kotak banyak port) dan PC/Client (monitor)
function nodeSVG(x, y, hub) {
  if (hub) {
    return `<rect x="${x - 16}" y="${y - 12}" width="32" height="24" rx="4" fill="rgba(251,191,36,0.12)" stroke="${AMBER}" stroke-width="2"/>` +
           `<rect x="${x - 10}" y="${y - 3}" width="4" height="6" rx="1" fill="${AMBER}"/>` +
           `<rect x="${x - 2}" y="${y - 3}" width="4" height="6" rx="1" fill="${AMBER}"/>` +
           `<rect x="${x + 6}" y="${y - 3}" width="4" height="6" rx="1" fill="${AMBER}"/>`;
  } else {
    return `<rect x="${x - 14}" y="${y - 12}" width="28" height="18" rx="2" fill="rgba(34,211,238,0.12)" stroke="${CYAN}" stroke-width="2"/>` +
           `<line x1="${x}" y1="${y + 6}" x2="${x}" y2="${y + 12}" stroke="${CYAN}" stroke-width="2"/>` +
           `<line x1="${x - 8}" y1="${y + 12}" x2="${x + 8}" y2="${y + 12}" stroke="${CYAN}" stroke-width="2"/>`;
  }
}

function edgeSVG(x1, y1, x2, y2) {
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${EDGE}" stroke-width="2"/>`;
}

function renderTopologySVG({ nodes, edges, extra }) {
  let s = '<svg viewBox="0 0 320 190" xmlns="http://www.w3.org/2000/svg">';
  if (extra) s += extra;
  edges.forEach(([a, b]) => { const n1 = nodes[a], n2 = nodes[b]; s += edgeSVG(n1.x, n1.y, n2.x, n2.y); });
  nodes.forEach(n => { s += nodeSVG(n.x, n.y, n.hub); });
  s += '</svg>';
  return s;
}

// 6 Data Master Topologi (Digunakan sebagai referensi bentuk dan soal visual)
const TOPOLOGIES = [
  {
    type: 'diagram', key: 'star', short: 'Star', name: 'Topologi Star',
    build() {
      const outer = circleNodes(6, 160, 100, 62);
      return { nodes: [{ x: 160, y: 100, hub: true }, ...outer], edges: outer.map((_, i) => [0, i + 1]) };
    },
    explanation: 'Topologi Star memusatkan semua koneksi ke satu perangkat pusat (hub/switch). Mudah menambah perangkat baru dan jika kabel di satu klien rusak tidak memengaruhi node lain. Kelemahannya: pusat mati, jaringan lumpuh.'
  },
  {
    type: 'diagram', key: 'ring', short: 'Ring', name: 'Topologi Ring',
    build() {
      const nodes = circleNodes(6, 160, 100, 62);
      return { nodes, edges: ringPairs(6) };
    },
    explanation: 'Topologi Ring menghubungkan tiap perangkat ke dua tetangganya membentuk lintasan lingkaran. Hemat kabel, tapi kalau satu titik (node/kabel) terputus, jaringan akan putus karena alirannya searah.'
  },
  {
    type: 'diagram', key: 'mesh', short: 'Mesh', name: 'Topologi Mesh',
    build() {
      const nodes = circleNodes(5, 160, 100, 58);
      return { nodes, edges: allPairs(5) };
    },
    explanation: 'Topologi Mesh menghubungkan setiap perangkat langsung ke semua perangkat lain. Paling andal karena banyak jalur alternatif, namun boros kabel dan instalasinya paling rumit.'
  },
  {
    type: 'diagram', key: 'bus', short: 'Bus', name: 'Topologi Bus',
    build() {
      const xs = [70, 115, 160, 205, 250];
      const nodes = xs.map(x => ({ x, y: 135 }));
      const drops = xs.map(x => `<line x1="${x}" y1="70" x2="${x}" y2="117" stroke="${EDGE}" stroke-width="2"/>`).join('');
      const backbone =
        `<line x1="40" y1="70" x2="280" y2="70" stroke="${EDGE}" stroke-width="3"/>` +
        `<line x1="40" y1="60" x2="40" y2="80" stroke="${EDGE}" stroke-width="3"/>` +
        `<line x1="280" y1="60" x2="280" y2="80" stroke="${EDGE}" stroke-width="3"/>`;
      return { nodes, edges: [], extra: backbone + drops };
    },
    explanation: 'Topologi Bus menyambungkan semua perangkat ke satu kabel tunggal (backbone) memanjang. Sangat sederhana untuk jaringan kecil, namun rawat tabrakan data (collision) dan rentan jika kabel utama rusak.'
  },
  {
    type: 'diagram', key: 'tree', short: 'Tree', name: 'Topologi Tree',
    build() {
      const nodes = [
        { x: 160, y: 30, hub: true },
        { x: 95, y: 100, hub: true }, { x: 225, y: 100, hub: true },
        { x: 55, y: 160 }, { x: 135, y: 160 }, { x: 185, y: 160 }, { x: 265, y: 160 },
      ];
      return { nodes, edges: [[0, 1], [0, 2], [1, 3], [1, 4], [2, 5], [2, 6]] };
    },
    explanation: 'Topologi Tree (Pohon) adalah jaringan hierarkis. Biasanya terdiri dari topologi Bus sebagai tulang punggung (di atas) yang menyambungkan beberapa topologi Star. Digunakan pada jaringan skala besar.'
  },
  {
    type: 'diagram', key: 'hybrid', short: 'Hybrid', name: 'Topologi Hybrid',
    build() {
      const starOuter = circleNodes(3, 80, 100, 40);
      const ringNodes = circleNodes(4, 235, 100, 42);
      const nodes = [{ x: 80, y: 100, hub: true }, ...starOuter, ...ringNodes];
      return { nodes, edges: [[0, 1], [0, 2], [0, 3], [4, 5], [5, 6], [6, 7], [7, 4], [0, 7]] };
    },
    explanation: 'Topologi Hybrid merupakan gabungan dua atau lebih jenis topologi berbeda (contoh di atas: jaringan Star di kiri dihubungkan ke jaringan Ring di kanan). Biasanya diterapkan jika dua gedung/perusahaan digabung.'
  },
];

// 4 Soal Berbasis Teks/Studi Kasus 
const SCENARIOS = [
  {
    type: 'scenario', key: 'mesh', short: 'Mesh', name: 'Topologi Mesh',
    question: "Sebuah bank nasional membutuhkan sistem jaringan server tingkat tinggi. Jika salah satu jalur terputus atau rusak, data harus secara otomatis dialihkan ke jalur lain tanpa mengalami down-time atau gangguan pada nasabah. Topologi apa yang wajib digunakan?",
    explanation: "Topologi Mesh sangat tepat diimplementasikan pada fasilitas vital seperti Bank karena memiliki tingkat toleransi kesalahan paling tinggi berkat interkoneksi di setiap nodenya."
  },
  {
    type: 'scenario', key: 'star', short: 'Star', name: 'Topologi Star',
    question: "Laboratorium sekolah ingin membangun jaringan. Guru menginginkan agar kabel dari satu komputer siswa yang tercabut tidak membuat komputer siswa lain mati internetnya. Jaringan juga harus mudah ditambahkan komputer baru di kemudian hari. Topologi apa yang cocok?",
    explanation: "Topologi Star memusatkan beban di Switch pusat. Gangguan di kabel cabang komputer 1 tidak akan berimbas pada komputer lainnya. Menambah komputer juga sesimpel mencolokkan kabel baru ke Switch."
  },
  {
    type: 'scenario', key: 'bus', short: 'Bus', name: 'Topologi Bus',
    question: "Sebuah kantor rental kecil memiliki ruangan sempit yang memanjang. Mereka memiliki dana terbatas dan ingin menyambungkan 5 komputernya menggunakan kabel BNC/Coaxial dengan konektor T (T-Connector) satu garis lurus saja. Topologi apakah ini?",
    explanation: "Topologi Bus sangat populer di masa lalu karena hemat kabel dengan memasang T-Connector dan diakhiri dengan Terminator di ujung-ujungnya. Murah namun rawan tabrakan data."
  },
  {
    type: 'scenario', key: 'tree', short: 'Tree', name: 'Topologi Tree',
    question: "Gedung perusahaan memiliki 3 lantai. Teknisi memasang satu Switch utama di ruang server lantai 1. Kemudian, Switch utama tersebut ditarik ke Switch distribusi di masing-masing lantai, lalu dibagikan lagi ke komputer karyawan tiap divisi. Topologi apa yang terbentuk?",
    explanation: "Topologi Tree (Pohon) adalah susunan bertingkat (hierarki). Ia mendistribusikan jalur dari hub/switch paling tinggi ke switch di bawahnya, hingga berujung pada klien komputer."
  }
];

const ALL_QUESTIONS = [...TOPOLOGIES, ...SCENARIOS];

// Variabel status kuis
const quizHint = document.getElementById('quizHint');
const quizBody = document.getElementById('quizBody');
const progressBox = document.getElementById('progressBox');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');

let order = [], currentIndex = 0, score = 0, answered = false, results = [];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Fungsi untuk mencari data SVG topologi aslinya berdasarkan key/nama
function getTopologyByKey(key) {
  return TOPOLOGIES.find(t => t.key === key);
}

// Mengambil 1 jawaban benar dan 3 jawaban salah (dikembalikan sebagai object utuh agar bisa digambar)
function buildOptionObjects(q) {
  const allKeys = TOPOLOGIES.map(t => t.key);
  const others = allKeys.filter(k => k !== q.key);
  const wrong = shuffle(others).slice(0, 3);
  const finalKeys = shuffle([q.key, ...wrong]);
  
  // Return mapping berisi data object topologi asli (bukan hanya string)
  return finalKeys.map(k => getTopologyByKey(k));
}

function updateProgress() {
  progressBox.style.display = '';
  progressFill.style.width = (currentIndex / order.length) * 100 + '%';
  progressLabel.textContent = `Soal ${currentIndex + 1} / ${order.length}`;
}

function renderQuestion() {
  const q = order[currentIndex];
  const opts = buildOptionObjects(q); // berisi array object Topologi

  let mediaHTML = '';
  let optionsHTML = '';

  if (q.type === 'diagram') {
    // Mode Visual: Muncul diagram besar, pilihan ganda berupa Teks
    quizHint.textContent = "Amati bentuk diagramnya, lalu tebak nama topologi jaringannya.";
    const topoData = q.build();
    const svg = renderTopologySVG(topoData);
    const hasHub = topoData.nodes.some(n => n.hub);
    
    let legendHTML = `<span class="legend-item"><i class="dot dot-cyan"></i>Komputer (Client)</span>`;
    if (hasHub) { legendHTML += `<span class="legend-item"><i class="dot dot-amber"></i>Switch / Hub</span>`; }

    mediaHTML = `
      <div class="diagram-panel">${svg}</div>
      <div class="legend">${legendHTML}</div>
    `;

    // Render pilihan Teks biasa
    optionsHTML = opts.map(o => `<button class="option" data-key="${o.key}">${o.short}</button>`).join('');

  } else {
    // Mode Skenario/Studi Kasus: Muncul Kotak Teks Kasus, pilihan ganda berupa DIAGRAM MINI
    quizHint.textContent = "Analisis studi kasus berikut dan tebak jenis topologinya.";
    mediaHTML = `
      <div class="scenario-box">
        <strong>📝 Studi Kasus / Skenario:</strong><br><br>
        ${q.question}
      </div>
    `;

    // Render pilihan Diagram (Visual)
    optionsHTML = opts.map(o => {
      const svgStr = renderTopologySVG(o.build());
      return `
        <button class="option option-img" data-key="${o.key}">
          <div class="mini-diagram">${svgStr}</div>
          <span>${o.short}</span>
        </button>
      `;
    }).join('');
  }

  // Tampilkan ke layar
  quizBody.innerHTML = `
    ${mediaHTML}
    <div class="options">${optionsHTML}</div>
    <div id="feedbackSlot"></div>
  `;

  // Attach Event Listener ke tombol
  quizBody.querySelectorAll('.option').forEach(btn => {
    btn.addEventListener('click', () => handleAnswer(btn, q));
  });
  updateProgress();
}

function handleAnswer(btn, q) {
  if (answered) return;
  answered = true;
  const correct = btn.dataset.key === q.key;
  
  quizBody.querySelectorAll('.option').forEach(b => {
    b.disabled = true;
    if (b.dataset.key === q.key) b.classList.add('correct');
    else if (b === btn) b.classList.add('incorrect');
  });
  
  if (correct) score++;
  results.push({ short: q.short, correct });

  const isLast = currentIndex === order.length - 1;
  document.getElementById('feedbackSlot').innerHTML = `
    <div class="feedback ${correct ? 'is-correct' : 'is-incorrect'}">
      <p class="feedback-title">${correct ? 'Tepat sekali.' : `Belum tepat — solusi yang benar adalah ${q.name}.`}</p>
      <p class="feedback-text">${q.explanation}</p>
      <button class="next-btn" id="nextBtn">${isLast ? 'Lihat Hasil Akhir' : 'Lanjut ke Soal Berikutnya'}</button>
    </div>
  `;
  document.getElementById('nextBtn').addEventListener('click', goNext);
}

function goNext() {
  currentIndex++;
  answered = false;
  if (currentIndex >= order.length) renderResult();
  else renderQuestion();
}

function renderResult() {
  progressBox.style.display = 'none';
  quizHint.textContent = "Kuis telah selesai!";
  const total = order.length;
  
  const finalScore = Math.round((score / total) * 100);

  let msg;
  if (finalScore === 100) msg = 'Sempurna! Kamu memahami semua teori jaringan dan bentuk fisiknya dengan sangat baik.';
  else if (finalScore >= 70) msg = 'Kerja bagus! Sedikit lagi mencapai kesempurnaan. Ingat kembali karakteristik uniknya.';
  else msg = 'Yuk baca kembali buku catatan pengenalan jaringan komputernya. Semangat!';

  quizBody.innerHTML = `
    <div class="result">
      <p class="result-score">${finalScore}</p>
      <p style="font-size: 16px; margin-top: -10px; color: var(--text-dim);">Skor Akhir</p>
      <p class="result-msg">${msg}</p>
      <div class="result-list">
        ${results.map((r, i) => `<span class="result-chip ${r.correct ? 'ok' : 'bad'}" title="Soal ${i+1}">${r.correct ? '✓' : '✕'} ${r.short}</span>`).join('')}
      </div>
      <button class="next-btn" id="retryBtn">Ulangi Kuis</button>
    </div>
  `;
  
  document.getElementById('retryBtn').addEventListener('click', startQuiz);

  window.parent.postMessage({
      type: 'QUIZ_FINISHED',
      score: finalScore
  }, '*');
}

function startQuiz() {
  order = shuffle(ALL_QUESTIONS);
  currentIndex = 0; 
  score = 0; 
  answered = false; 
  results = [];
  renderQuestion();
}

startQuiz();
</script>
